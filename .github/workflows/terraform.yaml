name: Infrastructure Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yaml'
concurrency: 
    group: terraform-deployment
    cancel-in-progress: true
jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    env:
         
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_smtp_user: ${{ secrets.TF_VAR_SMTP_USER }}
      TF_VAR_smtp_pass: ${{ secrets.TF_VAR_SMTP_PASS }}
      TF_VAR_password_salt: ${{ secrets.TF_VAR_PASSWORD_SALT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: configure aws credantials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "eu-north-1" 
  
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
      
      - name: terraform destroy if fail
        if: failure()
        run: terraform destroy -auto-approve
        